[workspace]
members = [
    "crates/mettle-capability",
    "crates/mettle-cli",
    "crates/mettle-compiler",
    "crates/mettle-http",
    "crates/mettle-runtime",
    "crates/mettle-syntax",
]
resolver = "3"

[workspace.package]
version = "1.0.0-alpha.1"
edition = "2024"
rust-version = "1.98"
license = "UNLICENSED"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[workspace.dependencies]
bytes = "1.12.1"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", default-features = false }
hyper-rustls = { version = "0.27.9", default-features = false }
hyper-util = { version = "0.1.20", default-features = false }
rustls = { version = "0.23.45", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
tokio = { version = "1.53.1", default-features = false }
toml = { version = "1.1.6", default-features = false, features = ["std", "serde", "parse"] }
